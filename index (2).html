html{scroll-padding-top:env(safe-area-inset-top,0px)}

.w{max-width:760px;margin:0 auto;padding:16px}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.5}
.chip{border-radius:20px;padding:5px 12px;font-size:.9rem}
.tabs button{flex:1;min-width:80px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:.9rem}
.tag{display:inline-block;background:var(--ac2);border-radius:8px;padding:2px 9px;margin:2px;font-size:.85rem}
.bar{height:10px;background:var(--ac2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
label.t{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
a{color:var(--ac)}
.o{display:block;width:100%;text-align:left;margin:6px 0}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.o.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;white-space:pre-wrap;max-width:90%}
.msg.u{background:var(--ac);color:#fff;margin-left:auto}.msg.a{background:var(--ac2)}
textarea{width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:60px}
input[type=checkbox]{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--ac);cursor:pointer}
input:not([type=checkbox]){flex:1;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;font:inherit;color:var(--tx)}
.tk{margin-bottom:6px}.tk details{margin:2px 0 6px 28px;font-size:.92rem}.tk summary{cursor:pointer;color:var(--ac)}.tk p{margin:6px 0}.tk ol{margin:4px 0;padding-left:20px}
select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}
</style></head><body><div class="w">

['Prova do módulo (aba Provas)',50,'Testar o que você aprendeu e liberar o próximo nível.',['Abra a aba Provas e inicie a prova do módulo.','Faça sem consultar anotações.','Leia a explicação de cada resposta, certa ou errada.','Com 80% ou mais, o próximo nível é desbloqueado.']]]],

const $=s=>document.querySelector(s),mem={};
const st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};

const best=(g,l)=>+(st.get(`lp:b:${g}:${l}`)||0);

async function askAI(turns){
 if(sample)return (await sample(turns,{cache:false})).text;

 if(!PROXY){h['x-api-key']=st.get('lp:key');h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
 const r=await fetch(PROXY||'https://api.anthropic.com/v1/messages',{method:'POST',headers:h,body:JSON.stringify({model:MODEL,max_tokens:2500,messages:turns})});
 if(!r.ok)throw new Error('http '+r.status);
 const j=await r.json();return j.content.filter(c=>c.type=='text').map(c=>c.text).join('')}
function theme(t){document.documentElement.dataset.theme=t;st.set('lp:theme',t);$('#th').textContent=t==='dark'?'☀️ Modo dia':'🌙 Modo noite'}
theme(st.get('lp:theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

 const d=D[S.lang],m=d.m[S.lv];let tot=0,ok=0;

 const best=st.get(`lp:b:${S.lang}:${S.lv}`);

 const d=D[S.lang],sv=svl(),has=w=>sv.some(x=>x[0]==w);
 const row=(w,t)=>`<div class="c" style="margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center"><span><b>${esc(w)}</b> <span class="mu">— ${esc(t)}</span></span><span><button data-sp="${esc(w)}">🔊</button> <button data-sv="${esc(w+'|'+t)}">${has(w)?'✖':'⭐'}</button></span></div>`;
 let h=`<div class="c"><h2>📖 Dicionário ${d.n}</h2><div class="row" style="margin:0"><input id="dq" maxlength="60" placeholder="Palavra em português ou em ${d.n}" value="${esc(DQ)}"><button class="p" data-a="ds">Buscar</button></div><p class="mu">Busca primeiro no glossário básico. Para qualquer outra palavra, a IA entrega tradução, definição e exemplos.</p></div>`;
 if(DR){h+=DR.loc.map(x=>row(x[0],x[1])).join('');
  if(DR.load)h+='<div class="c">Consultando a IA…</div>';
  if(DR.err)h+=`<div class="c mu">${esc(DR.err)}</div>`;
  if(DR.ai){const a=DR.ai;h+=`<div class="c"><h2>${esc(a.palavra)} <button data-sp="${esc(a.palavra)}">🔊</button> <button data-sv="${esc(a.palavra+'|'+a.traducao)}">${has(a.palavra)?'✖':'⭐'}</button></h2><p><b>${esc(a.traducao)}</b> <span class="mu">· ${esc(a.classe||'')}</span></p><p>${esc(a.definicao||'')}</p>${(a.exemplos||[]).map(x=>`<p>💬 ${esc(x.o)} <button data-sp="${esc(x.o)}">🔊</button><br><span class="mu">${esc(x.t)}</span></p>`).join('')}${a.dica?`<p class="mu">💡 ${esc(a.dica)}</p>`:''}</div>`}
  else if(!DR.load&&DR.loc.length&&can())h+='<button data-a="dai">Buscar com IA</button>'}
 h+=`<div class="c"><h2>⭐ Meu vocabulário (${sv.length})</h2>${sv.length?'':'<p class="mu">Toque em ⭐ para guardar palavras aqui.</p>'}</div>`+sv.map(x=>row(x[0],x[1])).join('');
 return h}
async function dsearch(useAI){
 const q=DQ.trim();if(!q)return;const n=norm(q),d=D[S.lang];
 const loc=G[S.lang].split(';').map(x=>x.split('|')).filter(x=>norm(x[0]).includes(n)||norm(x[1]).includes(n)).slice(0,8);
 DR={loc,ai:null,err:'',load:false};
 if(useAI||!loc.length){
  if(!can())DR.err='Nenhum resultado no glossário básico. Para buscar qualquer palavra com IA, toque em 🔑 IA.';
  else{DR.load=true;R();
   try{let r=await askAI([{role:'user',content:`Você é um dicionário ${d.n}-português para alunos brasileiros de nível ${S.lv}. Consulta: "${q.replace(/"/g,'')}" (pode estar em português ou em ${d.n}). Responda SOMENTE JSON: {"palavra":"palavra em ${d.n}","traducao":"tradução em português","classe":"classe gramatical","definicao":"definição simples em ${d.n}","exemplos":[{"o":"frase em ${d.n}","t":"tradução em português"},{"o":"","t":""}],"dica":"observação curta em português (falso cognato, uso ou pronúncia)"}`}]);
   r=JSON.parse(r.slice(r.indexOf('{'),r.lastIndexOf('}')+1));if(!r.palavra||!r.traducao)throw 0;DR.ai=r}
   catch(e){DR.err='Não consegui consultar a IA agora. Tente de novo em instantes.'}
   DR.load=false}}
 R()}
function R(){nav();$('#ky').style.display=sample?'none':'';$('#main').innerHTML={plan,vid,quiz,dic,ai}[S.tab]();if(S.tab=='ai'&&$('#in'))$('#in').value=R.draft||''}
async function send(txt){
 if(!txt||busy||!can())return;H.push({r:'u',t:txt});busy=true;R.draft='';R();
 const d=D[S.lang],sys=`Você é um tutor de ${d.n} simpático para um falante de português do Brasil. Nível do aluno: ${S.lv}. Módulo: ${d.m[S.lv].join(', ')}. Explique em português, use exemplos em ${d.n} adequados ao nível, corrija erros com gentileza e termine com um mini exercício. Seja breve.`;
 const t=H.map(h=>({role:h.r=='u'?'user':'assistant',content:h.t}));t[t.length-1].content=sys+'\n\nMensagem do aluno: '+txt;
 try{H.push({r:'a',t:await askAI(t)})}catch(e){H.push({r:'a',t:'Não consegui responder agora. Tente de novo em instantes.'})}
 busy=false;R()}
async function genQuiz(){
 Q={qs:[],i:0,s:0,r:null};$('#main').innerHTML='<div class="c">Gerando prova com IA…</div>';const d=D[S.lang];
 try{let r=await askAI([{role:'user',content:`Crie 10 questões de múltipla escolha de ${d.n} nível ${S.lv}, cobrindo todos estes tópicos: ${d.m[S.lv].join(', ')}. Enunciados em ${d.w} (ou português quando for sobre significado), explicação curta em português. Responda SOMENTE JSON: [{"q":"","o":["","","",""],"a":0,"e":""}]`}]);r=r.replace(/```json|```/g,'');r=JSON.parse(r.slice(r.indexOf('['),r.lastIndexOf(']')+1));Q.qs=r.filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>1&&x.a<x.o.length);if(!Q.qs.length)throw 0}
 catch(e){Q=null;alert('Não foi possível gerar a prova agora. Use a prova rápida.')}R()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const g=k=>b.dataset[k];
 if(g('l')){S.lang=g('l');DR=null;DQ='';st.set('lp:lang',S.lang);if(!open(S.lv))S.lv='A1';st.set('lp:lv',S.lv);Q=null;H=[]}
 else if(g('a')=='next'){S.lv=LV[LV.indexOf(S.lv)+1];st.set('lp:lv',S.lv);Q=null;H=[];S.tab='plan'}
 else if(g('v')){S.lv=g('v');st.set('lp:lv',S.lv);Q=null;H=[]}
 else if(g('t'))S.tab=g('t');
 else if(g('e')){if(g('e').endsWith(': ')){S.tab='ai';R.draft=g('e');R();$('#in').focus();return}send(g('e'));return}
 else if(g('o')!=null){if(Q.r!=null)return;Q.r=+g('o');if(Q.r==Q.qs[Q.i].a)Q.s++}
 else if(g('a')=='reset'){DAYS.forEach((d,i)=>d[1].forEach((t,j)=>st.set(`lp:${S.lang}:${S.lv}:${i}:${j}`,'0')))}
 else if(g('a')=='qs'){Q={qs:D[S.lang].q[S.lv].map(x=>({q:x[0],o:x[1],a:x[2]})),i:0,s:0,r:null}}
 else if(g('a')=='qa'){genQuiz();return}
 else if(g('a')=='qn')Q.i++,Q.r=null;
 else if(g('a')=='qx')Q=null;
 else if(g('a')=='send'){send($('#in').value.trim());return}
 else if(g('a')=='ds'){dsearch(false);return}
 else if(g('a')=='dai'){dsearch(true);return}
 else if(g('sp')!=null){if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(g('sp'));u.lang=S.lang=='en'?'en-US':'es-ES';speechSynthesis.cancel();speechSynthesis.speak(u)}return}
 else if(g('sv')!=null){const i=g('sv').indexOf('|'),w=g('sv').slice(0,i),t=g('sv').slice(i+1);let l=svl();l=l.some(x=>x[0]==w)?l.filter(x=>x[0]!=w):[...l,[w,t]];st.set('lp:dic:'+S.lang,JSON.stringify(l))}
 else return;R()});
document.addEventListener('keydown',e=>{if(e.target.id=='dq'&&e.key=='Enter'){e.preventDefault();DQ=e.target.value;dsearch(false)}});
document.addEventListener('change',e=>{
 if(e.target.dataset.k){st.set(e.target.dataset.k,e.target.checked?'1':'0');R()}
 if(e.target.id=='mn'){S.min=+e.target.value;st.set('lp:min',S.min);R()}});
document.addEventListener('input',e=>{if(e.target.id=='in')R.draft=e.target.value;if(e.target.id=='dq')DQ=e.target.value});
$('#ky').onclick=()=>{const k=prompt('Cole sua chave da API da Anthropic (fica salva só neste navegador). Deixe vazio para remover.',st.get('lp:key')||'');if(k!==null){st.set('lp:key',k.trim());R()}};
R();
(async()=>{try{if(window.claude&&claude.use){sample=await claude.use('sample');if(sample)R()}}catch(e){sample=null}})();
</script></body></html>
